[project]
name = "comparador-luz-gas"
version = "0.1.0"
description = "Consulta el comparador de ofertas de energía de la CNMC y devuelve JSON listo para un LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
comparador-luz-gas = "comparador_luz_gas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comparador_luz_gas"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"
# claude-arsenal se instala vendorizado; su estilo no es cosa de este repo.
extend-exclude = ["claude-arsenal", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RUF", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[tool.pytest.ini_options]
markers = ["live: consulta la API real de la CNMC"]
